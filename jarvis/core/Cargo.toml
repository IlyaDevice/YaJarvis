[package]
name = "jarvis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Джарвис: голосовой ассистент целиком на Яндекс Станции"
build = "build.rs"

[features]
default = ["lua"]
lua = ["dep:mlua"]
native-plugins = ["dep:jarvis-native-plugins"]
homeassistant = ["dep:jarvis-homeassistant"]
yandexhome = ["dep:jarvis-yandexhome"]
smartlife = ["dep:jarvis-smartlife", "dep:jarvis-home-common"]
xiaomi = ["dep:jarvis-xiaomi", "dep:jarvis-home-common"]
vpn = ["dep:jarvis-vpn"]
openai = ["dep:jarvis-cloud", "jarvis-cloud/openai", "dep:futures-util"]
gemini = ["dep:jarvis-cloud", "jarvis-cloud/gemini", "dep:futures-util"]
grok = ["dep:jarvis-cloud", "jarvis-cloud/grok", "dep:futures-util"]
elevenlabs = ["dep:jarvis-cloud", "jarvis-cloud/elevenlabs", "dep:futures-util"]
chatgpt = ["dep:jarvis-chatgpt"]
youtube = ["dep:jarvis-youtube", "dep:jarvis-home-common"]
wake-training = ["dep:jarvis-wake-train"]

[[bin]]
name = "jarvis"
path = "src/main.rs"

[dependencies]
jarvis-native-plugins = { path = "../native-plugins", optional = true }
jarvis-station = { path = "../station-runtime" }
jarvis-wake-train = { path = "../modules/wake-train", optional = true }
jarvis-youtube = { path = "../modules/youtube", optional = true }
jarvis-chatgpt = { path = "../modules/chatgpt", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
jarvis-cloud = { path = "../modules/cloud", optional = true }
jarvis-vpn = { path = "../modules/vpn", optional = true }
jarvis-yandexhome = { path = "../modules/yandexhome", optional = true }
jarvis-homeassistant = { path = "../modules/homeassistant", optional = true }
jarvis-smartlife = { path = "../modules/smartlife", optional = true }
jarvis-xiaomi = { path = "../modules/xiaomi", optional = true }
jarvis-home-common = { path = "../modules/home-common", optional = true }
mlua = { version = "0.11.4", optional = true, features = ["lua54", "vendored", "serialize", "send"] }
jarvis-dsp = { path = "../dsp" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
bcrypt = { version = "0.17", default-features = false, features = ["std"] }
hmac = "0.12"
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
getrandom = "0.3"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
base64 = "0.22"
regex-lite = "0.1"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "socks", "stream", "http2"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
