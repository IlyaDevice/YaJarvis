[package]
name = "jarvis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Джарвис: голосовой ассистент целиком на Яндекс Станции"
build = "build.rs"

[[bin]]
name = "jarvis"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
bcrypt = { version = "0.17", default-features = false, features = ["std"] }
hmac = "0.12"
sha2 = { version = "0.10", default-features = false }
hex = "0.4"
getrandom = "0.3"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
