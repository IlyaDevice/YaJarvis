name: Tests
on:
  push:
    branches: [main, rust]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo test --locked --workspace --all-features
        working-directory: jarvis
      - run: cargo check --locked -p jarvis --no-default-features
        working-directory: jarvis
      - name: Check panel and installer assets
        run: |
          for f in jarvisd/ui/js/*.js; do node --input-type=module --check < "$f" || exit 1; done
          node --check installer/ui/setup.js
          sh scripts/pack-plugins.sh /tmp/jarvis-plugins
