name: Build release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: jarvisd/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Test
        run: |
          (cd jarvisd && go test ./...)
          node --check jarvisd/ui/app.js
          node --check installer/ui/setup.js
      - name: Build clean release
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RELEASE: '1'
          GDRIVE_CLIENT: ${{ secrets.GDRIVE_CLIENT }}
          GDRIVE_SECRET: ${{ secrets.GDRIVE_SECRET }}
        run: sh build.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/* --verify-tag --title "YaJavis $GITHUB_REF_NAME" --generate-notes
